name: 공시 수집

on:
  schedule:
    # 평일 한국시간 07:00~20:59, 10분마다 (cron은 UTC 기준, 정각 혼잡을 피해 3분 단위로)
    - cron: "3,13,23,33,43,53 22-23 * * 0-4"
    - cron: "3,13,23,33,43,53 0-11 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: fetch-dart
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: DART 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_dart.py
      - name: 시황 수집
        continue-on-error: true   # 시황이 실패해도 공시 저장은 그대로 진행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_market.py
      - name: 종목 상세
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_corps.py
      - name: 주간 리포트
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/weekly.py
      - name: 텔레그램 알림
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py
      - name: 변경분 커밋
        run: |
          git config user.name "gongsi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          MSG="공시 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git commit -q -m "$MSG"
          # 그 사이 저장소가 바뀌었으면(관심종목 저장, 파일 업로드 등) 최신본 위에 이번 데이터만 다시 얹어 저장
          for i in 1 2 3 4; do
            if git push -q; then echo "저장 완료"; exit 0; fi
            echo "저장 충돌 → 최신본 기준으로 다시 시도 ($i)"
            rm -rf /tmp/newdata && cp -r data /tmp/newdata
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -rf data && cp -r /tmp/newdata data
            git add data/
            git diff --cached --quiet && { echo "변경 없음"; exit 0; }
            git commit -q -m "$MSG"
            sleep $((i * 3))
          done
          echo "저장 실패"; exit 1
