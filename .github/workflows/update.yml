name: 공시 수집

on:
  schedule:
    # 평일 한국시간 07:00~20:59, 10분마다 (cron은 UTC 기준, 정각 혼잡을 피해 3분 단위로)
    - cron: "3,13,23,33,43,53 22-23 * * 0-4"
    - cron: "3,13,23,33,43,53 0-11 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: fetch-dart
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: DART 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_dart.py
      - name: 시황 수집
        continue-on-error: true   # 시황이 실패해도 공시 저장은 그대로 진행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_market.py
      - name: 종목 상세
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_corps.py
      - name: 주간 리포트
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/weekly.py
      - name: 텔레그램 알림
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py
      - name: 변경분 커밋
        run: |
          git config user.name "gongsi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "공시 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
